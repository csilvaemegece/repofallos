{% extends "base.html" %}

{% block title %}Materias{% endblock %}
{% block breadcrumb %}Materias{% endblock %}

{% block content %}
<div class="page-title">Materias</div>
<div class="page-sub">Taxonomía usada para clasificar los fallos — una por línea.</div>

<div class="card" style="max-width:520px;">
  <form method="POST">
    <div class="field">
      <label>Lista de materias</label>
      <textarea name="materias" rows="12">{{ materias|join('\n') }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>
{% endblock %}
